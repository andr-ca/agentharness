name: Scheduled link check

# P1-08: the PR-blocking markdown-links job in ci.yml runs --offline (path
# existence only) precisely so a flaky or slow third-party URL never blocks
# a merge. Real external links still need checking — just not on the
# merge-blocking path. Weekly is enough to catch link rot without being
# noisy; manual dispatch lets you run it on demand after editing links.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  link-check-online:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check all markdown links, including external URLs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --exclude is only for hosts that reject the checker itself, not
          # for links that are actually broken: an exclusion asserts the
          # link is fine and the checker is wrong, so it has to be true. A
          # genuinely dead link gets fixed or removed, never silenced here.
          #
          # npmjs.com answers automated requests with 403 whatever the URL,
          # so it reported this repo's own published package as broken.
          # There is no per-package variant that behaves differently. The
          # www. is optional in the regex (Copilot review on #227): only a
          # www. link exists today, but a bare https://npmjs.com/... added
          # later would otherwise re-break this same check.
          #
          # Kept as a YAML comment rather than inline in args below: '#'
          # inside a folded scalar (>-) is literal text, not a comment, so
          # it would be passed to lychee as arguments.
          args: >-
            --no-progress
            --exclude 'https://(www\.)?npmjs\.com/'
            '**/*.md'
          fail: true
