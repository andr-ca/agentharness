intro: 'Registry of governed, versioned, deterministic context this harness owns and ships: what exists,
  its authority tier (if any), lifecycle, loading behavior, provenance, and freshness. Runtime context
  (summarization, RAG retrieval, learned cross-session memory) is explicitly out of scope — see docs/superpowers/specs/2026-08-05-context-plane-slice-0-design.md
  for the ownership boundary this registry enforces.'
schema_note: 'Hand-maintained source, like manifest.yaml — not generated. Add one entry per always-on
  rule file, skill, custom agent, guide, generated/source pair, or docs/operational/-class asset. `authority`
  is `publish_authority` or `rigor_tier` only for the handful of assets that are themselves levels of
  one of precedence.yaml''s two ladders; everything else is `none`. `freshness.invalidate_on` lists the
  paths whose change invalidates this entry — CI (check_context_freshness() in tools/verify-content-quality.py)
  compares each listed path''s last-git-change date against `last_verified` and flags stale entries: a
  warning for `authority: none` entries, a failure for entries on a real precedence ladder, matching ''advisory
  docs may lag; rules may not'' (issue #198). Re-verifying an entry means bumping `last_verified` in the
  same commit that reviews it, so freshness claims are themselves auditable in git history.'
